<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Maj. Rishabh Singh Sambyal — Indian Army veteran sharing lessons on courage, character and commitment through talks and YouTube conversations."
    />
    <meta name="theme-color" content="#1c1917" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maj. Rishabh Singh Sambyal — Courage • Character • Commitment" />
    <meta
      property="og:description"
      content="Leadership, discipline and nation-first living — talks, interviews and social links."
    />
    <meta property="og:image" content="https://i.ytimg.com/vi/x63HCoDfAhQ/hqdefault.jpg" />
    <title>Maj. Rishabh Singh Sambyal — Courage • Character • Commitment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const saved = localStorage.getItem("rss-theme");
        if (saved === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
